name: Release

on:
  push:
    branches:
      - ci-test

jobs:
  build:
    strategy:
      matrix:
        target:
          - name: i686-unknown-linux-gnu
            os: ubuntu-latest
            build: cross
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build: native
          - name: x86_64-apple-darwin
            os: macos-latest
            build: native
          - name: aarch64-apple-darwin
            os: macos-latest
            build: native
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            build: native
          - name: x86_64-unknown-freebsd
            os: ubuntu-latest
            build: cross
          - name: aarch64-linux-android
            os: ubuntu-latest
            build: ndk
            ndk_linker: aarch64-linux-android21-clang
          - name: armv7-linux-androideabi
            os: ubuntu-latest
            build: ndk
            ndk_linker: armv7a-linux-androideabi21-clang
          - name: i686-linux-android
            os: ubuntu-latest
            build: ndk
            ndk_linker: i686-linux-android21-clang

    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.target.build == 'cross'
        run: cargo install cross --locked

      - name: Add Required Rust Target
        run: rustup target add ${{ matrix.target.name }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target.build }}" == "cross" ]]; then
            cross build --release --target ${{ matrix.target.name }}
          elif [[ "${{ matrix.target.build }}" == "ndk" ]]; then
            TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
            cargo build --release --target ${{ matrix.target.name }} \
              --config "target.${{ matrix.target.name }}.linker='$TOOLCHAIN/${{ matrix.target.ndk_linker }}'"
          else
            cargo build --release --target ${{ matrix.target.name }}
          fi

      - name: Prepare Release Asset
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.target.name }}" == *"windows"* ]]; then
            cp target/${{ matrix.target.name }}/release/dnstracer.exe release/
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            find target/${{ matrix.target.name }}/release -maxdepth 1 -type f | while read file; do
              if file "$file" | grep -q 'Mach-O'; then
                cp "$file" release/
              fi
            done
          else
            find target/${{ matrix.target.name }}/release -maxdepth 1 -type f -executable -exec cp {} release/ \;
          fi
          tar -czf ${{ matrix.target.name }}-binary.tar.gz -C release .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}-binary
          path: ${{ matrix.target.name }}-binary.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
